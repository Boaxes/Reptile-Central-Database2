name: Deploy Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: project-d481c97a-382d-4d71-9f4
  REGION: us-central1
  SERVICE_NAME: reptile-central
  CLOUD_SQL_INSTANCE: project-d481c97a-382d-4d71-9f4:us-central1:reptile-central-mysql
  MYSQL_DATABASE: sql3817488
  MYSQL_USER: reptile

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/328698967588/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-cloud-run-deployer@project-d481c97a-382d-4d71-9f4.iam.gserviceaccount.com

      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -fsSL -o cloud-sql-proxy \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64"
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 3306 "$CLOUD_SQL_INSTANCE" > cloud-sql-proxy.log 2>&1 &
          echo "Waiting for proxy port 3306..."
          timeout 30 bash -c 'until bash -c "echo > /dev/tcp/127.0.0.1/3306" 2>/dev/null; do sleep 1; done'
          echo "Proxy ready."

      - name: Verify MySQL connectivity through proxy
        env:
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: |
          python - <<'PY'
          import os, sys
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import URL
          e = create_engine(URL.create(
              "mysql+pymysql",
              username="${{ env.MYSQL_USER }}",
              password=os.environ["MYSQL_PASSWORD"],
              host="127.0.0.1", port=3306,
              database="${{ env.MYSQL_DATABASE }}",
          ))
          with e.connect() as c:
              row = c.execute(text("SELECT COUNT(*) FROM Customers")).scalar()
              print(f"OK: Customers row count = {row}")
          PY

      - name: Start Streamlit
        env:
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "3306"
          MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}
          MYSQL_USER: ${{ env.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: |
          streamlit run frontend/Home.py --server.port 8501 --server.headless true \
            > streamlit.out 2> streamlit.err &
          timeout 60 bash -c 'until curl -sf http://localhost:8501 > /dev/null; do sleep 2; done'

      - name: Run tests
        run: |
          pytest --base-url http://localhost:8501 -v --tb=short 2>&1 | tee pytest-output.log
          exit ${PIPESTATUS[0]}

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            streamlit.out
            streamlit.err
            cloud-sql-proxy.log
            pytest-output.log

  deploy:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/328698967588/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-cloud-run-deployer@project-d481c97a-382d-4d71-9f4.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --source=. \
            --allow-unauthenticated \
            --add-cloudsql-instances="$CLOUD_SQL_INSTANCE" \
            --set-env-vars="MYSQL_DATABASE=$MYSQL_DATABASE,MYSQL_USER=$MYSQL_USER,MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }},CLOUD_SQL_CONNECTION_NAME=$CLOUD_SQL_INSTANCE,AI_MYSQL_USER=BOT,AI_MYSQL_PASSWORD=${{ secrets.AI_MYSQL_PASSWORD }},OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" \
            --min-instances=1 \
            --max-instances=1 \
            --quiet
